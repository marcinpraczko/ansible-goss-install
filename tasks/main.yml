---
- name: Check if HOME environment variable is defined
  fail:
    msg: |
      HOME environment variable is not defined.
      Please make sure that 'gather_facts' is set to 'True' in playbook.
  when: ansible_env.HOME is undefined

- name: Display goss_dst_dir
  debug:
    var: goss_dst_dir
  when: ansible_verbosity >= 2

- name: Add HOME prefix to 'goss_dst_dir' if equals 'bin' (default value for non-root users)
  set_fact:
    goss_dst_dir: "{{ [ansible_env.HOME, goss_dst_dir] | ansible.builtin.path_join }}"
  when: goss_dst_dir == 'bin'

- name: "Ensure that destination folder exists"
  ansible.builtin.file:
    state: directory
    path: "{{ goss_dst_dir }}"
    mode: "{{ goss_dst_dir_mode }}"
  when: goss_create_dst_dir

- name: "Check existing Goss binary"
  ansible.builtin.stat:
    path: "{{ goss_dst_dir }}/{{ goss_bin_filename }}"
    follow: true
    checksum_algorithm: sha256
  register: goss_existing_binary_stat

- name: "Determine whether Goss binary needs updating"
  ansible.builtin.set_fact:
    goss_binary_needs_update: >-
      {{ not goss_existing_binary_stat.stat.exists or
         (goss_existing_binary_stat.stat.islnk | default(false)) or
         (goss_existing_binary_stat.stat.checksum | default('')) != goss_binary_sha256sum }}

- name: "Download Goss release archive from GitHub"
  ansible.builtin.get_url:
    url: "{{ goss_url }}"
    dest: "{{ goss_dst_dir }}/{{ goss_archive_filename }}"
    checksum: "sha256:{{ goss_sha256sum }}"
    mode: 0644
  when: goss_binary_needs_update

- name: "Remove outdated Goss binary or symlink"
  ansible.builtin.file:
    path: "{{ goss_dst_dir }}/{{ goss_bin_filename }}"
    state: absent
  when: goss_binary_needs_update

- name: "Extract Goss binary"
  ansible.builtin.unarchive:
    src: "{{ goss_dst_dir }}/{{ goss_archive_filename }}"
    dest: "{{ goss_dst_dir }}"
    remote_src: true
    creates: "{{ goss_dst_dir }}/{{ goss_bin_filename }}"
    include:
      - "{{ goss_bin_filename }}"
  when: goss_binary_needs_update

- name: "Ensure Goss binary is executable"
  ansible.builtin.file:
    path: "{{ goss_dst_dir }}/{{ goss_bin_filename }}"
    mode: 0755

- name: "Verify Goss binary checksum"
  ansible.builtin.stat:
    path: "{{ goss_dst_dir }}/{{ goss_bin_filename }}"
    checksum_algorithm: sha256
  register: goss_binary_stat

- name: "Assert Goss binary checksum"
  ansible.builtin.assert:
    that:
      - goss_binary_stat.stat.checksum == goss_binary_sha256sum

- name: "Remove downloaded Goss archive"
  ansible.builtin.file:
    path: "{{ goss_dst_dir }}/{{ goss_archive_filename }}"
    state: absent
